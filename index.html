<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagfactory - Multiverse Arcade</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    min-height: 100vh;
    padding: 55px 15px;
    background: linear-gradient(to bottom, red, yellow);
}

h1 {
    color: darkred;
    font-size: 36px;
}

p {
    font-size: 19px;
    line-height: 1.6;
}

button {
    background: darkred;
    color: white;
    font-size: 16px;
    padding: 13px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 8px;
    transition: transform 0.2s, background 0.2s;
}

button:hover {
    background: crimson;
    transform: scale(1.05);
}

#gameScreen {
    display: none;
    max-width: 440px;
    margin: auto;
}

#gameScreen h1 {
    color: #25e5ff;
}

#gameCanvas {
    display: block;
    width: 100%;
    max-width: 360px;
    height: auto;
    margin: 15px auto;
    border: 3px solid #263238;
    border-radius: 12px;
    touch-action: none;
}

#score {
    font-size: 24px;
    font-weight: bold;
    color: #173b25;
}

#instructions {
    font-size: 16px;
}

.cursor-trail {
    position: fixed;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    animation: fade 0.7s ease-out forwards;
}

@keyframes fade {
    to {
        opacity: 0;
        scale: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    .cursor-trail {
        animation-duration: 0.2s;
    }
}
</style>
</head>

<body>

<!-- ================= HOME PAGE ================= -->

<div id="homeScreen">
    <h1>Hello my name is lagfactory</h1>

    <p>
        I'm a new coder and this is my first website.
        I hope you're having a good day!!
    </p>

    <button onclick="changeColor()">
        🎨 Change Background Color
    </button>

    <br>

    <button onclick="openGame()">
        🚀 PLAY LAGFACTORY MULTIVERSE
    </button>
</div>

<!-- ================= GAME SCREEN ================= -->

<div id="gameScreen">
    <h1 id="worldTitle">✈️ Jet Flight</h1>

    <div id="score">Score: 0</div>

    <canvas id="gameCanvas" width="360" height="520"></canvas>

    <p id="instructions">
        Press SPACE, click, or tap to fly!
    </p>

    <button onclick="startGame()">▶ Restart Game</button>
    <button onclick="goHome()">🏠 Back to Homepage</button>
</div>

<script>

// ============================================
// HOMEPAGE BACKGROUND BUTTON
// ============================================

function changeColor() {
    const colors = [
        "linear-gradient(to bottom, red, yellow)",
        "linear-gradient(to bottom, blue, cyan)",
        "linear-gradient(to bottom, purple, pink)",
        "linear-gradient(to bottom, limegreen, lightgreen)",
        "linear-gradient(to bottom, black, gray)",
        "linear-gradient(to bottom, orange, gold)",
        "linear-gradient(to bottom, hotpink, violet)"
    ];  document.body.style.background =
        colors[Math.floor(Math.random() * colors.length)];
}

// ============================================
// RAINBOW CURSOR TRAIL
// ============================================

let hue = 0;
let lastTrail = 0;

document.addEventListener("mousemove", function(e) {
    const now = performance.now();

    if (now - lastTrail < 18) return;
    lastTrail = now;

    const particle = document.createElement("div");
    particle.className = "cursor-trail";

    const color = `hsl(${hue}, 100%, 60%)`;

    particle.style.left = e.clientX + "px";
    particle.style.top = e.clientY + "px";
    particle.style.background = color;
    particle.style.boxShadow = `0 0 12px ${color}`;

    hue = (hue + 18) % 360;

    document.body.appendChild(particle);

    setTimeout(() => particle.remove(), 750);
});

// ============================================
// GAME VARIABLES
// ============================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let player;
let obstacles = [];
let stars = [];
let score = 0;

let world = "jet";
let running = false;
let gameOver = false;
let animationId = null;
let lastTime = 0;
let portal = null;

function makeObstacle(x) {
    return {
        x: x,
        gapY: 100 + Math.random() * 220,
        gap: world === "space" ? 165 : 145,
        scored: false
    };
}

function makeStars() {
    stars = [];

    for (let i = 0; i < 90; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: 1 + Math.random() * 2,
            speed: 0.5 + Math.random() * 2
        });
    }
}

// ============================================
// SCREEN NAVIGATION
// ============================================

function openGame() {
    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    startGame();
}

function goHome() {
    running = false;

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";

    document.body.style.background =
        "linear-gradient(to bottom, red, yellow)";

    resetGame();
}

function startGame() {
    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    resetGame();

    running = true;
    lastTime = 0;

    animationId = requestAnimationFrame(loop);
}

// ============================================
// RESET GAME
// ============================================

function resetGame() {
    player = {
        x: 85,
        y: 240,
        velocity: 0,
        radius: 10
    };

    obstacles = [];
    score = 0;
    world = "jet";
    portal = null;
    running = false;
    gameOver = false;

    for (let i = 0; i < 3; i++) {
        obstacles.push(makeObstacle(400 + i * 190));
    }
 makeStars();
    updateLabels();

    document.getElementById("score").textContent = "Score: 0";

    document.getElementById("instructions").textContent =
        "Press SPACE, click, or tap to fly! Reach 150 to unlock the portal.";

    draw();
}

function updateLabels() {
    const title = document.getElementById("worldTitle");

    if (world === "jet") {
        title.textContent = "✈️ Jet Flight";
    } else if (world === "portal") {
        title.textContent = "🌀 PORTAL UNLOCKED!";
    } else {
        title.textContent = "🛸 Alien Space";
    }
}

// ============================================
// FLIGHT CONTROLS
// ============================================

function flap() {
    if (
        document.getElementById("gameScreen").style.display === "none"
    ) {
        return;
    }

    if (gameOver || !running) {
        startGame();
        return;
    }

    player.velocity = -5.5;
}

document.addEventListener("keydown", function(e) {
    if (
        e.code === "Space" &&
        document.getElementById("gameScreen").style.display !== "none"
    ) {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    flap();
});

// ============================================
// PORTAL AT SCORE 150
// ============================================

function unlockPortal() {
    world = "portal";
    obstacles = [];

    portal = {
        x: W + 70,
        y: H / 2,
        rotation: 0
    };

    updateLabels();

    document.getElementById("instructions").textContent =
        "PORTAL UNLOCKED! Fly into the glowing portal!";
}

function enterSpace() {
    world = "space";
    portal = null;

    obstacles = [
        makeObstacle(400),
        makeObstacle(590),
        makeObstacle(780)
    ];

    makeStars();
    updateLabels();

    document.getElementById("instructions").textContent =
        "WELCOME TO SPACE! Dodge the asteroids!";

    document.getElementById("score").textContent =
        "Score: " + score + " | SPACE WORLD";
}

// ============================================
// BACKGROUNDS
// ============================================

function drawBackground() {
    if (world === "jet" || world === "portal") {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#70d6ff");
        sky.addColorStop(1, "#d6f6ff");

        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        drawCloud(45, 80);
        drawCloud(240, 140);
        drawCloud(160, 45);

    } else {
        const space = ctx.createLinearGradient(0, 0, W, H);
        space.addColorStop(0, "#07021f");
        space.addColorStop(0.5, "#17105c");
        space.addColorStop(1, "#360747");

        ctx.fillStyle = space;
        ctx.fillRect(0, 0, W, H);

        // Stars
        ctx.fillStyle = "white";

        stars.forEach(star => {
            ctx.globalAlpha = 0.6 + Math.random() * 0.4;

            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();

            if (running) {
                star.x -= star.speed;

                if (star.x < 0) {
                    star.x = W;
                    star.y = Math.random() * H;
                }
            }
        });

        ctx.globalAlpha = 1;

        // Distant planet
        ctx.fillStyle = "#713bd1";
        ctx.beginPath();
        ctx.arc(285, 85, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#bba2ff";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(285, 85, 48, 12, -0.3, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawCloud(x, y) {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.arc(x, y, 17, 0, Math.PI * 2);
    ctx.arc(x + 19, y - 9, 22, 0, Math.PI * 2);
    ctx.arc(x + 41, y, 17, 0, Math.PI * 2);
    ctx.fill();
}

// ============================================
// OBSTACLES
// ============================================

function drawObstacles() {
    obstacles.forEach(obstacle => {
        const gapTop = obstacle.gapY - obstacle.gap / 2;
        const gapBottom = obstacle.gapY + obstacle.gap / 2;

        if (world === "space") {
            drawAsteroidColumn(obstacle.x, -10, gapTop + 10);
            drawAsteroidColumn(
                obstacle.x,
                gapBottom - 10,
                H - gapBottom + 10
            );

        } else {
            ctx.fillStyle = "#20b447";
            ctx.fillRect(obstacle.x, 0, 48, gapTop);
            ctx.fillRect(obstacle.x, gapBottom, 48, H - gapBottom);
  ctx.fillStyle = "#087c2c";
            ctx.fillRect(obstacle.x - 5, gapTop - 18, 58, 18);
            ctx.fillRect(obstacle.x - 5, gapBottom, 58, 18);

            ctx.strokeStyle = "#075c20";
            ctx.lineWidth = 2;
            ctx.strokeRect(obstacle.x, 0, 48, gapTop);
            ctx.strokeRect(
                obstacle.x, gapBottom, 48, H - gapBottom
            );
        }
    });
}

function drawAsteroidColumn(x, y, height) {
    if (height <= 0) return;

    for (let py = y; py < y + height; py += 27) {
        const seed = Math.abs(
            Math.floor(x / 10) + Math.floor(py / 10)
        );

        const offset = (seed % 7) - 3;
        const radius = 13 + (seed % 5);

        ctx.fillStyle = seed % 2 ? "#817b9c" : "#aaa1bd";
        ctx.strokeStyle = "#50476b";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(x + 24 + offset, py + 10, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#625873";
        ctx.beginPath();
        ctx.arc(x + 20 + offset, py + 7, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ============================================
// JET CHARACTER
// ============================================

function drawJet() {
    ctx.save();
    ctx.translate(player.x, player.y);

    const angle = running
        ? Math.max(-0.45, Math.min(0.65, player.velocity * 0.07))
        : 0;

    ctx.rotate(angle);

    // Blue engine flame
    if (running) {
        const length = 15 + Math.random() * 12;
        const flame = ctx.createLinearGradient(-12, 0, -12 - length, 0);

        flame.addColorStop(0, "#ffffff");
        flame.addColorStop(0.35, "#00e5ff");
        flame.addColorStop(1, "#2979ff");

        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.moveTo(-10, -4);
        ctx.lineTo(-10 - length, 0);
        ctx.lineTo(-10, 4);
        ctx.closePath();
        ctx.fill();
    }

    // Jet body
    ctx.fillStyle = "#cfd8dc";
    ctx.strokeStyle = "#37474f";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(25, 0);
    ctx.lineTo(4, -5);
    ctx.lineTo(-12, -5);
    ctx.lineTo(-22, -10);
    ctx.lineTo(-17, -3);
    ctx.lineTo(-17, 3);
    ctx.lineTo(-22, 10);
    ctx.lineTo(-12, 5);
    ctx.lineTo(4, 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Wings
    ctx.fillStyle = "#90a4ae";

    ctx.beginPath();
    ctx.moveTo(5, -4);
    ctx.lineTo(-7, -19);
    ctx.lineTo(-13, -19);
    ctx.lineTo(-9, -4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(5, 4);
    ctx.lineTo(-7, 19);
    ctx.lineTo(-13, 19);
    ctx.lineTo(-9, 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cockpit
    ctx.fillStyle = "#00e5ff";
    ctx.strokeStyle = "#006064";

    ctx.beginPath();
    ctx.ellipse(9, 0, 7, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Red tail fins
    ctx.fillStyle = "#ef5350";

    ctx.beginPath();
    ctx.moveTo(-14, -4);
    ctx.lineTo(-21, -9);  ctx.lineTo(-19, -3);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-14, 4);
    ctx.lineTo(-21, 9);
    ctx.lineTo(-19, 3);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

// ============================================
// UFO CHARACTER
// ============================================

function drawUFO() {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Tractor beam
    ctx.fillStyle = "rgba(0,255,180,0.18)";
    ctx.beginPath();
    ctx.moveTo(-12, 8);
    ctx.lineTo(12, 8);
    ctx.lineTo(20, 25);
    ctx.lineTo(-20, 25);
    ctx.closePath();
    ctx.fill();

    // Saucer
    ctx.fillStyle = "#bfc9d8";
    ctx.strokeStyle = "#f5f5ff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.ellipse(0, 5, 24, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Neon rim
    ctx.strokeStyle = "#00ffd5";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.ellipse(0, 6, 21, 7, 0, 0, Math.PI);
    ctx.stroke();

    // Glass dome
    const dome = ctx.createLinearGradient(0, -20, 0, 2);
    dome.addColorStop(0, "#d6ffff");
    dome.addColorStop(1, "#00b8ff");

    ctx.fillStyle = dome;
    ctx.beginPath();
    ctx.ellipse(0, -4, 13, 12, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Dome reflection
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(-5, -9, 3, 0, Math.PI * 2);
    ctx.fill();

    // Alien eyes
    ctx.fillStyle = "#142038";
    ctx.beginPath();
    ctx.ellipse(-4, -2, 2, 4, 0, 0, Math.PI * 2);
    ctx.ellipse(4, -2, 2, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // UFO lights
    for (let i = -1; i <= 1; i++) {
        ctx.fillStyle = i === 0 ? "#fff176" : "#ff5df4";

        ctx.beginPath();
        ctx.arc(i * 12, 7, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

// ============================================
// PORTAL EFFECT
// ============================================

function drawPortal() {
    if (!portal) return;

    ctx.save();
    ctx.translate(portal.x, portal.y);

    if (running) {
        portal.rotation += 0.035;
    }

    ctx.shadowBlur = 30;
    ctx.shadowColor = "#b000ff";

    ctx.fillStyle = "rgba(130,30,255,0.25)";
    ctx.beginPath();
    ctx.arc(0, 0, 55, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(portal.rotation);

    ctx.strokeStyle = "#d45bff";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.ellipse(0, 0, 43, 52, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 46, 0, 0, Math.PI * 2);
    ctx.stroke();

    const inside = ctx.createRadialGradient(0, 0, 2, 0, 0, 38);
    inside.addColorStop(0, "#10053d");
    inside.addColorStop(0.6, "#5422bd");
    inside.addColorStop(1, "#f17cff");

    ctx.fillStyle = inside;
    ctx.beginPath();
    ctx.ellipse(0, 0, 26, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.fillText("ENTER PORTAL!", portal.x, portal.y - 67);
}

// ============================================
// DRAW GAME
// ============================================

function draw() {
    drawBackground();
    drawObstacles();
    drawPortal();

    if (world === "jet") {
        ctx.fillStyle = "#9cde52";
        ctx.fillRect(0, H - 15, W, 15);

        ctx.fillStyle = "#5aab32";
        ctx.fillRect(0, H - 15, W, 4);
    }

    if (world === "space") {
        drawUFO();
    } else {
        drawJet();
    }

    if (!running && gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        roundRect(25, 190, 310, 110, 14);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 25px Arial";
        ctx.fillText("GAME OVER!", W / 2, 230);

        ctx.font = "16px Arial";
        ctx.fillText("Tap to try again!", W / 2, 263);
    }
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
}

// ============================================
// MAIN GAME LOOP
// ============================================

function loop(time) {
    animationId = null;

    if (!running) return;

    const dt = lastTime
        ? Math.min((time - lastTime) / 16.667, 2)
        : 1;

    lastTime = time;

    // Gravity
    player.velocity += 0.28 * dt;
    player.y += player.velocity * dt;

    // Portal stage
    if (world === "portal" && portal) {
        portal.x -= 2.4 * dt;

        // Fly close to the portal to enter the new world
        const nearPortal =
            Math.abs(player.x - portal.x) < 36 &&
            Math.abs(player.y - portal.y) < 60;

        if (nearPortal) {
            enterSpace();
        }

        // Bring the portal back if the player misses it
        if (portal && portal.x < -60) {
            portal.x = W + 40;
        }

        draw();
        animationId = requestAnimationFrame(loop);
        return;
    } // Move pipes or asteroids
    obstacles.forEach(obstacle => {
        obstacle.x -= (world === "space" ? 2.8 : 2.4) * dt;

        if (!obstacle.scored && obstacle.x + 48 < player.x) {
            obstacle.scored = true;
            score++;

            document.getElementById("score").textContent =
                "Score: " + score +
                (world === "space" ? " | SPACE WORLD" : "");

            if (score >= 150 && world === "jet") {
                unlockPortal();
            }
        }
    });

    if (world === "portal") {
        draw();
        animationId = requestAnimationFrame(loop);
        return;
    }

    // Recycle obstacles
    if (obstacles.length && obstacles[0].x < -65) {
        obstacles.shift();

        const last = obstacles[obstacles.length - 1];

        obstacles.push(
            makeObstacle(last ? last.x + 190 : W + 100)
        );
    }

    // Ceiling and ground collisions
    if (
        player.y - 10 < 0 ||
        (world === "jet" && player.y + 10 > H - 15) ||
        (world === "space" && player.y + 10 > H)
    ) {
        endGame();
        return;
    }

    // Pipe and asteroid collisions
    for (const obstacle of obstacles) {
        const gapTop = obstacle.gapY - obstacle.gap / 2;
        const gapBottom = obstacle.gapY + obstacle.gap / 2;

        const overlaps =
            player.x + 20 > obstacle.x &&
            player.x - 20 < obstacle.x + 48;

        if (
            overlaps &&
            (
                player.y - 19 < gapTop ||
                player.y + 19 > gapBottom
            )
        ) {
            endGame();
            return;
        }
    }

    draw();
    animationId = requestAnimationFrame(loop);
}

function endGame() {
    running = false;
    gameOver = true;

    document.getElementById("instructions").textContent =
        "Final score: " + score + " — restart to play again!";

    draw();
}

// ============================================
// INITIALIZE
// ============================================

resetGame();

</script>
</body>
</html>
